# MeetCite - start everything with:  docker compose up -d --build
# Then open http://localhost:8080
#
# For a temporary public HTTPS demo link (Cloudflare quick tunnel):
#   docker compose --profile public up -d
#   docker compose logs cloudflared   (look for the https://....trycloudflare.com address)

x-backend-env: &backend-env
  ENVIRONMENT: production
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  DATABASE_URL: postgresql+psycopg://meetcite:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/meetcite
  DATA_DIR: /data
  TASK_MODE: celery
  REDIS_URL: redis://redis:6379/0
  AI_MODE: ${AI_MODE:-real}
  DEVICE: ${DEVICE:-cuda}
  WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8_float16}
  HF_TOKEN: ${HF_TOKEN:-}
  BART_MODEL: ${BART_MODEL:-facebook/bart-large-cnn}
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
  DEFAULT_SUMMARIZER: ${DEFAULT_SUMMARIZER:-llm}
  CLOUD_LLM_ENABLED: ${CLOUD_LLM_ENABLED:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CORS_ORIGINS: '["http://localhost:8080"]'

services:
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped

  api:
    build: ./backend
    environment: *backend-env
    volumes: ["meetcite-data:/data"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment: *backend-env
    volumes:
      - meetcite-data:/data
      - model-cache:/models
      # Put your fine-tuned BART checkpoint in ./models to use it (BART_MODEL=/finetuned/bart-ami).
      - ./models:/finetuned:ro
    depends_on: [redis, postgres, ollama]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama:
    image: ollama/ollama:0.5.4
    volumes: ["ollama-models:/root/.ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: 2m
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Downloads the LLM once (about 4.7 GB) and then exits.
  ollama-pull:
    image: curlimages/curl:8.11.1
    depends_on: [ollama]
    restart: "no"
    command: >
      sh -c "until curl -sf http://ollama:11434/api/version; do sleep 2; done;
             curl -s http://ollama:11434/api/pull -d '{\"name\": \"${OLLAMA_MODEL:-llama3.1:8b}\", \"stream\": false}'"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meetcite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: meetcite
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetcite"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["public"]
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on: [frontend]

volumes:
  meetcite-data:
  postgres-data:
  model-cache:
  ollama-models:
