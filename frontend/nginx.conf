server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Recordings can be large (spec: up to two hours).
    client_max_body_size 1100m;

    # Basic security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # WebSocket upgrade for live progress.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    location /docs { proxy_pass http://api:8000; }
    location /openapi.json { proxy_pass http://api:8000; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths load index.html so React Router can handle them.
    location / {
        try_files $uri /index.html;
    }
}
